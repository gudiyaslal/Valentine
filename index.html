<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine 💌</title>

  <!-- Handwritten font -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#fff;
      font-family:"Patrick Hand", system-ui, sans-serif;
      overflow:hidden;
    }

    /* LETTER */
    .letter{
      width:min(720px, 92vw);
      padding:48px 40px;
      background:#fffbdc;
      border:3px dashed #ff9ecb;
      border-radius:22px;
    }

    /* TEXT */
    .question{
      font-size:clamp(32px, 5vw, 56px);
      line-height:1.1;
      color:#000;
      margin:0 0 48px;
    }

    /* BUTTONS */
    .button-zone{
      position:relative;
      display:flex;
      gap:48px;
    }

    button{
      border:none;
      border-radius:999px;
      padding:18px 56px;
      font-family:"Patrick Hand", system-ui, sans-serif;
      font-size:28px;
      cursor:pointer;
      background:none;
    }

    #yesBtn{
      background:#ff8fc1;
      color:#fff;
    }

    #noBtn{
      background:#ffdca1;
      color:#fff;
      position:relative;
    }

    /* CELEBRATION */
    .celebrate{
      position:fixed;
      inset:0;
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background:#fff;
      z-index:10;
      text-align:center;
    }

    .celebrate.show{
      display:flex;
    }

    .celebrate h1{
      font-size:clamp(36px, 6vw, 64px);
      margin-bottom:12px;
    }

    .celebrate p{
      font-size:22px;
      margin-bottom:18px;
    }

    .celebrate img{
      width:min(520px, 92vw);
      border-radius:18px;
    }
  </style>
</head>

<body>

  <!-- LETTER -->
  <div class="letter" id="letter">
    <div class="question">
      Rg,<br>
      Will you be my valentine?
    </div>

    <div class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <!-- CELEBRATION -->
  <div class="celebrate" id="celebrate">
    <h1>YAYAA!! 🎉💖</h1>
    <p>I LOVE YOU TOO 😌</p>

    <!-- Arsenal winning GIF -->
    <img
      src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExd3I0dmZrZTJ2NmVjdWFrcGZtZ2l0Z2ZybnlsY3VicG9nYzBzaGk2MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4Hk0ETSpgxCR95YPgY/giphy.gif"
      alt="Arsenal celebration"
    />
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const zone = document.getElementById("zone");
    const celebrate = document.getElementById("celebrate");

    /* NO RUNS AWAY */
    function clamp(n, min, max){
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py){
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width/2) - px;
      let dy = (b.top + b.height/2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      let newLeft = (b.left - z.left) + dx * 140;
      let newTop  = (b.top  - z.top ) + dy * 140;

      newLeft = clamp(newLeft, 0, z.width  - b.width);
      newTop  = clamp(newTop,  0, z.height - b.height);

      noBtn.style.position = "absolute";
      noBtn.style.left = newLeft + "px";
      noBtn.style.top  = newTop  + "px";
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width/2) - e.clientX,
        (b.top  + b.height/2) - e.clientY
      );
      if(d < 120) moveNo(e.clientX, e.clientY);
    });

    noBtn.addEventListener("click", e => e.preventDefault());

    /* YES CLICK */
    yesBtn.addEventListener("click", () => {
      celebrate.classList.add("show");
      confetti({
        particleCount: 300,
        spread: 120,
        origin: { y: 0.6 }
      });
    });
  </script>
</body>
</html>
