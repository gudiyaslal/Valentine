<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine 💌</title>

  <!-- Handwritten font -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#fff;
      font-family:"Patrick Hand", system-ui, sans-serif;
      overflow:hidden;
      padding: 18px;
    }

    /* LETTER (taller + paper grain) */
    .letter{
      width:min(760px, 92vw);
      min-height: 420px;                 /* (5) increased height */
      padding:56px 44px;
      border-radius:22px;
      position: relative;

      /* (1) paper-ish grain using layered gradients (no image) */
      background:
        radial-gradient(circle at 10% 20%, rgba(0,0,0,0.025) 0 1px, transparent 1px 100%),
        radial-gradient(circle at 80% 30%, rgba(0,0,0,0.02) 0 1px, transparent 1px 100%),
        radial-gradient(circle at 30% 80%, rgba(0,0,0,0.02) 0 1px, transparent 1px 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.01) 0 1px, transparent 1px 9px),
        #fffbdc;

      box-shadow: none;
      overflow:hidden;
    }

    /* (2) dashed border inside, not on edge */
    .letter::before{
      content:"";
      position:absolute;
      inset: 18px;                       /* pushes border inside */
      border:3px dashed #ff9ecb;
      border-radius:18px;
      pointer-events:none;
    }

    /* TEXT */
    .question{
      font-size:clamp(34px, 5vw, 58px);
      line-height:1.1;
      color:#000;
      margin:0;
    }

    /* Buttons container */
    .button-zone{
      position:relative;
      width: 100%;
      height: 120px;                     /* space for 2D movement */
      margin-top: 64px;
      display:block;
      opacity: 0;                        /* (6) start hidden */
      transform: translateY(8px);
      transition: opacity .45s ease, transform .45s ease;
      pointer-events: none;              /* disabled until shown */
    }

    .button-zone.show{
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* BUTTONS */
    button{
      border:none;
      border-radius:999px;
      padding:18px 56px;
      font-family:"Patrick Hand", system-ui, sans-serif;
      font-size:28px;
      cursor:pointer;
      box-shadow:none;
      position:absolute;
      top: 30px;                         /* base y position */
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    #yesBtn{
      left: 22%;
      background:#ff8fc1;
      color:#fff;
    }

    /* (3) heart pop on YES hover + tap */
    #yesBtn::after{
      content:"💖";
      position:absolute;
      left:50%;
      top:-10px;
      transform: translate(-50%, 0) scale(.6);
      opacity:0;
      pointer-events:none;
    }
    #yesBtn:hover::after,
    #yesBtn.tap-heart::after{
      animation: heartPop .7s ease forwards;
    }
    @keyframes heartPop{
      0%   { opacity:0; transform: translate(-50%, 4px) scale(.5); }
      30%  { opacity:1; transform: translate(-50%, -8px) scale(1); }
      100% { opacity:0; transform: translate(-50%, -22px) scale(1.15); }
    }

    #noBtn{
      left: 62%;
      background:#ffdca1;
      color:#fff;
    }

    /* CELEBRATION */
    .celebrate{
      position:fixed;
      inset:0;
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background:#fff;
      z-index:10;
      text-align:center;
      padding: 18px;
    }
    .celebrate.show{ display:flex; }

    .celebrate h1{
      font-size:clamp(36px, 6vw, 64px);
      margin: 0 0 10px;
    }
    .celebrate p{
      font-size:22px;
      margin: 0 0 18px;
    }
    .celebrate img{
      width:min(560px, 92vw);
      border-radius:18px;
    }

    /* tiny footer */
    .footer{
      margin-top: 28px;
      font-size: 14px;
      opacity:.7;
    }
  </style>
</head>

<body>

  <!-- LETTER -->
  <div class="letter" id="letter">
    <div class="question">
      Rg,<br>
      Will you be my valentine?
    </div>

    <div class="button-zone" id="zone">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </div>

    <div class="footer">do you think you have an option?</div>
  </div>

  <!-- CELEBRATION -->
  <div class="celebrate" id="celebrate">
    <h1>YAYAA!! 🎉💖</h1>
    <p>I LOVE YOU TOO 😌</p>

    <!-- Arsenal winning GIF -->
    <img
      src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExd3I0dmZrZTJ2NmVjdWFrcGZtZ2l0Z2ZybnlsY3VicG9nYzBzaGk2MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4Hk0ETSpgxCR95YPgY/giphy.gif"
      alt="Arsenal celebration"
    />
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const zone = document.getElementById("zone");
    const celebrate = document.getElementById("celebrate");

    /* (6) show buttons after delay */
    setTimeout(() => {
      zone.classList.add("show");
    }, 1100);

    /* (3) heart pop on mobile tap too */
    yesBtn.addEventListener("pointerdown", () => {
      yesBtn.classList.remove("tap-heart");
      void yesBtn.offsetWidth;
      yesBtn.classList.add("tap-heart");
    });

    /* (4) NO runs away in 2D inside button-zone */
    function clamp(n, min, max){
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py){
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      // direction away from pointer
      let dx = (b.left + b.width/2) - px;
      let dy = (b.top  + b.height/2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      // move a decent step in both axes
      let newLeft = (b.left - z.left) + dx * 170;
