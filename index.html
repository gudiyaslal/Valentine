<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <!-- Handwritten font -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Pacifico&display=swap" rel="stylesheet">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7;
      --bg2:#ffeef6;
      --ink:#231f20;
      --paper:#fffaf2;
      --paper2:#fff3e8;
      --seal:#ff3b7a;
      --yes:#ff3b7a;
      --yesHover:#ff1f68;
      --shadow: 0 18px 60px rgba(0,0,0,.16);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: "Patrick Hand", system-ui, sans-serif;
      color: var(--ink);
      overflow:hidden;
      padding:16px;
    }

    /* Full screen confetti canvas */
    #confettiCanvas{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      z-index:9999;
    }

    /* Stage container */
    .stage{
      width:min(820px, 94vw);
      display:grid;
      place-items:center;
    }

    /* Envelope card */
    .envelope-wrap{
      width:min(700px, 94vw);
      border-radius:26px;
      padding:22px;
      background: rgba(255,255,255,.55);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .topline{
      font-family: "Pacifico", cursive;
      font-size: clamp(20px, 3vw, 30px);
      margin: 6px 0 14px;
      opacity:.9;
    }

    /* Envelope */
    .envelope{
      width:min(560px, 92%);
      margin: 0 auto;
      position:relative;
      height: 280px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      animation: floaty 2.8s ease-in-out infinite;
    }
    @keyframes floaty{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-6px); }
    }

    .env-back{
      position:absolute;
      inset: 28px 24px 24px;
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, #fff6fb);
      box-shadow: 0 14px 30px rgba(0,0,0,.12);
    }

    /* Flap */
    .flap{
      position:absolute;
      left:50%;
      top: 38px;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 250px solid transparent;
      border-right: 250px solid transparent;
      border-bottom: 150px solid #ffe2ef;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.08));
      transform-origin: 50% 0%;
      transition: transform .55s cubic-bezier(.2,.9,.2,1);
    }

    /* Pocket */
    .pocket{
      position:absolute;
      left:50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: 520px;
      max-width: 92%;
      height: 170px;
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, #ffe9f2);
      overflow:hidden;
      border: 2px solid rgba(0,0,0,.06);
    }

    /* Pocket triangles */
    .pocket:before, .pocket:after{
      content:"";
      position:absolute;
      top:0;
      width:0;height:0;
      border-top: 85px solid transparent;
      border-bottom: 85px solid transparent;
    }
    .pocket:before{
      left:-2px;
      border-right: 180px solid rgba(255,59,122,.10);
    }
    .pocket:after{
      right:-2px;
      border-left: 180px solid rgba(255,59,122,.10);
    }

    /* Seal */
    .seal{
      position:absolute;
      left:50%;
      top: 168px;
      transform: translateX(-50%);
      width: 74px;
      height: 74px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #ff7aa7, var(--seal));
      box-shadow: 0 12px 24px rgba(255,59,122,.25), 0 8px 16px rgba(0,0,0,.10);
      display:grid;
      place-items:center;
      font-size: 30px;
      transition: transform .55s cubic-bezier(.2,.9,.2,1), opacity .35s ease;
    }

    /* Letter */
    .letter{
      position:absolute;
      left:50%;
      bottom: 34px;
      transform: translateX(-50%) translateY(120px);
      width: 520px;
      max-width: 92%;
      height: 200px;
      background: linear-gradient(180deg, var(--paper), var(--paper2));
      border-radius: 18px;
      border: 2px solid rgba(0,0,0,.08);
      box-shadow: 0 16px 40px rgba(0,0,0,.10);
      padding: 16px 16px 14px;
      text-align:left;
      transition: transform .65s cubic-bezier(.2,.95,.2,1);
      overflow:hidden;
    }

    .letter:before{
      content:"";
      position:absolute;
      inset: 10px;
      border: 2px dashed rgba(255,59,122,.25);
      border-radius: 14px;
      pointer-events:none;
      opacity:.9;
    }

    .letter h1{
      margin: 10px 0 8px;
      font-size: clamp(28px, 4.2vw, 44px);
      letter-spacing:.3px;
      line-height: 1.02;
      font-family: "Pacifico", cursive;
      font-weight: 400;
    }

    .letter p{
      margin: 0 0 12px;
      font-size: 18px;
      opacity:.92;
    }

    .button-zone{
      position: relative;
      width: 100%;
      height: 86px;
      margin-top: 8px;
      touch-action: none;
    }

    button{
      position:absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 14px 22px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease, left .08s ease, top .08s ease;
      will-change: left, top, transform;
      font-family: "Patrick Hand", system-ui, sans-serif;
    }

    #yesBtn{
      left: 14%;
      background: var(--yes);
      color:#fff;
    }
    #yesBtn:hover{ background: var(--yesHover); }

    /* Tiny heart hover */
    #yesBtn::after{
      content:"💖";
      position:absolute;
      left:50%;
      top:-10px;
      transform: translate(-50%, 0) scale(.6);
      opacity:0;
      pointer-events:none;
    }
    #yesBtn:hover::after,
    #yesBtn.tap-heart::after{
      animation: heartPop .7s ease forwards;
    }
    @keyframes heartPop{
      0%   { opacity: 0; transform: translate(-50%, 4px) scale(.5); }
      30%  { opacity: 1; transform: translate(-50%, -8px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -22px) scale(1.15); }
    }

    #noBtn{
      left: 62%;
      background:#e5e7eb;
      color:#111827;
    }

    .footer{
      margin-top: 10px;
      font-size: 14px;
      opacity:.75;
      text-align:center;
    }

    /* Open state */
    .open .flap{ transform: translateX(-50%) rotateX(165deg); }
    .open .seal{ transform: translateX(-50%) scale(.88); opacity:.85; }
    .open .letter{ transform: translateX(-50%) translateY(0px); }

    /* Celebration overlay */
    .celebrate{
      position:fixed;
      inset:0;
      display:none;
      place-items:center;
      background: radial-gradient(circle at top, #ffffff, #ffe9f2 45%, #ffd6e7);
      z-index: 9000;
      padding: 18px;
      text-align:center;
    }
    .celebrate.show{ display:grid; }

    .celebrate h2{
      font-family:"Pacifico", cursive;
      font-size: clamp(34px, 5vw, 58px);
      margin: 0 0 10px;
    }

    .celebrate .sub{
      font-size: 18px;
      margin: 0 0 14px;
      opacity:.9;
    }

    .celebrate img{
      width:min(520px, 95vw);
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
      border: 2px solid rgba(0,0,0,.06);
    }

    .tip{
      margin-top: 8px;
      font-size: 14px;
      opacity:.75;
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <div class="stage">
    <div class="envelope-wrap">
      <div class="topline">You’ve got mail… 💌</div>

      <div class="envelope" id="envelope" aria-label="Open the letter" role="button">
        <div class="env-back"></div>
        <div class="flap"></div>
        <div class="pocket"></div>
        <div class="seal">💗</div>

        <!-- Love letter content -->
        <div class="letter" id="letter">
          <p style="margin-top:2px;">Hey love…</p>
          <h1>Will you be my Valentine?</h1>

          <p>We’ve been doing “us” for like 5–6 years… so answer properly 😌</p>

          <div class="button-zone" id="zone">
            <button id="yesBtn" type="button">Yes</button>
            <button id="noBtn" type="button">No</button>
          </div>

          <div class="footer">do you think you have an option?</div>
        </div>
      </div>

      <div class="tip">Tap/click the envelope to open (or just wait 👀)</div>
    </div>
  </div>

  <!-- Celebration screen -->
  <div class="celebrate" id="celebrate">
    <div>
      <h2>YAAAY!! 🎉💖</h2>
      <p class="sub">Okay then… Arsenal celebration mode 😌❤️</p>

      <!-- Arsenal celebration GIF -->
      <img
        src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExd3I0dmZrZTJ2NmVjdWFrcGZtZ2l0Z2ZybnlsY3VicG9nYzBzaGk2MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4Hk0ETSpgxCR95YPgY/giphy.gif"
        alt="Arsenal celebration GIF"
      />

      <div class="tip">COYG 💪</div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById("envelope");
    const letter = document.getElementById("letter");
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const celebrate = document.getElementById("celebrate");

    // Confetti setup
    const confettiCanvas = document.getElementById("confettiCanvas");
    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 10,
          spread: 90,
          startVelocity: 45,
          ticks: 170,
          origin: { x: Math.random(), y: Math.random() * 0.25 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 320,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 260);
    }

    // Envelope open (click OR delay)
    let opened = false;
    function openEnvelope() {
      if (opened) return;
      opened = true;
      envelope.classList.add("open");
    }

    envelope.addEventListener("click", openEnvelope);
    setTimeout(openEnvelope, 1200);

    // Heart pop on mobile tap as well
    yesBtn.addEventListener("pointerdown", () => {
      yesBtn.classList.remove("tap-heart");
      void yesBtn.offsetWidth;
      yesBtn.classList.add("tap-heart");
    });

    // YES button grows slightly when NO dodges
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.1, yesScale + 0.09);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    // NO runs away (desktop + mobile)
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      let newLeft = (b.left - z.left) + dx * 170;
      let newTop  = (b.top - z.top) + dy * 170;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top  = newTop + "px";
      noBtn.style.transform = "translate(0,0)";

      growYes();
    }

    function handlePointer(e) {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top + b.height / 2) - e.clientY
      );
      if (d < 170) moveNo(e.clientX, e.clientY);
    }

    zone.addEventListener("pointermove", handlePointer);
    zone.addEventListener("pointerdown", handlePointer);

    // If they try to tap directly on NO
    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      moveNo(e.clientX, e.clientY);
    });
    noBtn.addEventListener("click", (e) => e.preventDefault());

    // YES click -> celebration
    yesBtn.addEventListener("click", () => {
      celebrate.classList.add("show");
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
