<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine 💌</title>

  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#fff;
      font-family:"Patrick Hand", system-ui, sans-serif;
      overflow:hidden;
      padding: 18px;
    }

    .letter{
      width:min(760px, 92vw);
      min-height: 460px; /* a bit taller */
      padding:56px 44px;
      border-radius:22px;
      position: relative;

      background:
        radial-gradient(circle at 10% 20%, rgba(0,0,0,0.025) 0 1px, transparent 1px 100%),
        radial-gradient(circle at 80% 30%, rgba(0,0,0,0.02) 0 1px, transparent 1px 100%),
        radial-gradient(circle at 30% 80%, rgba(0,0,0,0.02) 0 1px, transparent 1px 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.01) 0 1px, transparent 1px 9px),
        #fffbdc;

      box-shadow: none;
      overflow:hidden;
    }

    .letter::before{
      content:"";
      position:absolute;
      inset: 18px;
      border:3px dashed #ff9ecb;
      border-radius:18px;
      pointer-events:none;
    }

    .question{
      font-size:clamp(34px, 5vw, 58px);
      line-height:1.1;
      color:#000;
      margin:0;
    }

    /* Buttons container */
    .button-zone{
      position:relative;
      width: 100%;
      height: 170px;      /* more vertical room for 2D running */
      margin-top: 70px;
    }

    button{
      border:none;
      border-radius:999px;
      padding:18px 56px;
      font-family:"Patrick Hand", system-ui, sans-serif;
      font-size:28px;
      cursor:pointer;
      box-shadow:none;
      position:absolute;
      top: 40px;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    #yesBtn{
      left: 20%;
      background:#ff8fc1;
      color:#fff;
    }

    /* Heart pop on YES hover + tap */
    #yesBtn::after{
      content:"💖";
      position:absolute;
      left:50%;
      top:-10px;
      transform: translate(-50%, 0) scale(.6);
      opacity:0;
      pointer-events:none;
    }
    #yesBtn:hover::after,
    #yesBtn.tap-heart::after{
      animation: heartPop .7s ease forwards;
    }
    @keyframes heartPop{
      0%   { opacity:0; transform: translate(-50%, 4px) scale(.5); }
      30%  { opacity:1; transform: translate(-50%, -8px) scale(1); }
      100% { opacity:0; transform: translate(-50%, -22px) scale(1.15); }
    }

    #noBtn{
      left: 60%;
      background:#ffdca1;
      color:#fff;
      padding-bottom: 30px; /* room for the tiny text inside */
    }

    /* Tiny sticky text attached to NO */
    #noBtn .no-note{
      position:absolute;
      left:50%;
      bottom: 8px;
      transform: translateX(-50%);
      font-size: 12px;
      opacity: .85;
      white-space: nowrap;
      pointer-events:none;
    }

    .celebrate{
      position:fixed;
      inset:0;
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background:#fff;
      z-index:10;
      text-align:center;
      padding: 18px;
    }
    .celebrate.show{ display:flex; }

    .celebrate h1{
      font-size:clamp(36px, 6vw, 64px);
      margin: 0 0 10px;
    }
    .celebrate p{
      font-size:22px;
      margin: 0 0 18px;
    }
    .celebrate img{
      width:min(560px, 92vw);
      border-radius:18px;
    }
  </style>
</head>

<body>
  <div class="letter" id="letter">
    <div class="question">
      Rg,<br>
      Will you be my valentine?
    </div>

    <div class="button-zone" id="zone">
      <button id="yesBtn" type="button">Yes</button>

      <button id="noBtn" type="button">
        No
        <span class="no-note">do you think you have an option? 😈</span>
      </button>
    </div>
  </div>

  <div class="celebrate" id="celebrate">
    <h1>YAYAA!! 🎉💖</h1>
    <p>I LOVE YOU TOO 😌</p>
    <img
      src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExd3I0dmZrZTJ2NmVjdWFrcGZtZ2l0Z2ZybnlsY3VicG
