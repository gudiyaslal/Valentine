<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Valentine Letter 💌</title>

  <!-- Handwritten fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Pacifico&display=swap" rel="stylesheet">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7;
      --bg2:#fff1f7;
      --ink:#241f20;
      --env:#fff;
      --env2:#ffe6f1;
      --edge: rgba(0,0,0,.08);
      --seal:#ff3b7a;
      --seal2:#ff77a9;
      --yes:#ff3b7a;
      --yesHover:#ff1f68;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: "Patrick Hand", system-ui, sans-serif;
      color: var(--ink);
      overflow:hidden;
      padding:16px;
    }

    /* Confetti canvas */
    #confettiCanvas{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      z-index:9999;
    }

    /* Envelope stage */
    .stage{
      width:min(720px, 94vw);
      display:grid;
      place-items:center;
    }

    .envelope{
      width:min(640px, 94vw);
      height: 320px;
      position:relative;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      filter: drop-shadow(0 18px 50px rgba(0,0,0,.14));
    }

    /* Envelope base */
    .env-base{
      position:absolute;
      inset: 22px 18px 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, var(--env), var(--env2));
      border: 2px solid var(--edge);
      overflow:hidden;
    }

    /* Front pocket (simple triangle feel) */
    .env-pocket{
      position:absolute;
      left:50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: calc(100% - 36px);
      height: 190px;
      border-radius: 20px;
      background: linear-gradient(180deg, #fff, #ffeaf4);
      border: 2px solid rgba(0,0,0,.06);
      overflow:hidden;
    }
    .env-pocket::before{
      content:"";
      position:absolute;
      left:0; right:0; top:0;
      margin:auto;
      width:0; height:0;
      border-left: 280px solid transparent;
      border-right: 280px solid transparent;
      border-top: 130px solid rgba(255,59,122,.10);
      transform: translateY(-20px);
      opacity:.9;
    }

    /* Flap */
    .env-flap{
      position:absolute;
      left:50%;
      top: 30px;
      transform: translateX(-50%);
      width:0;height:0;
      border-left: 300px solid transparent;
      border-right: 300px solid transparent;
      border-bottom: 160px solid #ffe0ee;
      transform-origin: 50% 0%;
      transition: transform .7s cubic-bezier(.2,.95,.2,1);
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.10));
      z-index: 4;
    }

    /* Seal heart */
    .seal{
      position:absolute;
      left:50%;
      top: 168px;
      transform: translateX(-50%);
      width: 74px;
      height: 74px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, var(--seal2), var(--seal));
      box-shadow: 0 16px 28px rgba(255,59,122,.22), 0 10px 18px rgba(0,0,0,.12);
      display:grid;
      place-items:center;
      font-size: 32px;
      z-index: 6;
      transition: transform .9s cubic-bezier(.2,.95,.2,1);
    }

    /* Letter panel (inside) */
    .letter{
  position: relative;
  width: calc(100% - 80px);
  max-width: 560px;
  min-height: 220px;
  margin: 0 auto;
  padding: 22px 22px 18px;

  background: #fff6d8;              /* soft yellow paper */
  border: 2.5px dashed #ff7aa9;     /* pink dashed stroke */
  border-radius: 18px;

  box-shadow: none;                 /* remove all shadows */
  overflow: hidden;
}


    /* Title row (question + heart at right end) */
    .title-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom: 6px;
}


   .question{
  font-family: "Pacifico", cursive;
  font-weight: 400;
  font-size: clamp(28px, 4vw, 42px);
  margin: 0;
  line-height: 1.05;
}


   .side-heart{
  font-size: 26px;
  margin-top: 10px;
}

    .subline{
      margin: 0 6px 10px;
      font-size: 18px;
      opacity:0;
      transform: translateY(6px);
      transition: opacity .5s ease, transform .5s ease;
    }

    /* Buttons */
    .button-zone{
  position:relative;
  height: 96px;
  margin-top: 14px;
  touch-action:none;
  opacity:0;
  transform: translateY(8px);
  transition: opacity .45s ease, transform .45s ease;
}

    button{
      position:absolute;
      top:44%;
      transform: translateY(-50%);
      padding: 14px 22px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 999px;
      border:none;
      cursor:pointer;
      box-shadow: 0 12px 24px rgba(0,0,0,.12);
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      transition: transform .12s ease, background .12s ease, left .08s ease, top .08s ease;
      will-change:left,top,transform;
      font-family:"Patrick Hand", system-ui, sans-serif;
    }

    #yesBtn{
      left: 16%;
      background: var(--yes);
      color:#fff;
    }
    #yesBtn:hover{ background: var(--yesHover); }

    /* tiny heart pop on YES hover */
    #yesBtn::after{
      content:"💖";
      position:absolute;
      left:50%;
      top:-10px;
      transform: translate(-50%, 0) scale(.6);
      opacity:0;
      pointer-events:none;
    }
    #yesBtn:hover::after,
    #yesBtn.tap-heart::after{
      animation: heartPop .7s ease forwards;
    }
    @keyframes heartPop{
      0%   { opacity:0; transform: translate(-50%, 4px) scale(.5); }
      30%  { opacity:1; transform: translate(-50%, -8px) scale(1); }
      100% { opacity:0; transform: translate(-50%, -22px) scale(1.15); }
    }

    #noBtn{
      left: 62%;
      background:#e5e7eb;
      color:#111827;
    }

    .footer{
      margin-top: 10px;
      text-align:center;
      font-size: 14px;
      opacity:.75;
    }

    /* OPEN state choreography */
    .open .env-flap{
      transform: translateX(-50%) rotateX(165deg);
    }
    .open .letter{
      transform: translateX(-50%) translateY(0);
    }
   .open .seal{
  transform: translateX(calc(-50% + (min(640px, 94vw) * 0.37)));
}

    /* Reveal texts/buttons after open */
    .show-text .title-row,
    .show-text .subline{
      opacity:1;
      transform: translateY(0);
    }
    .show-buttons .button-zone{
      opacity:1;
      transform: translateY(0);
    }

    /* Celebration overlay */
    .celebrate{
      position:fixed;
      inset:0;
      display:none;
      place-items:center;
      background: radial-gradient(circle at top, #ffffff, #ffe9f2 45%, #ffd6e7);
      z-index:9000;
      padding: 18px;
      text-align:center;
    }
    .celebrate.show{ display:grid; }

    .celebrate h2{
      font-family:"Pacifico", cursive;
      font-weight:400;
      font-size: clamp(34px, 5vw, 60px);
      margin: 0 0 10px;
    }
    .celebrate .sub{
      font-size: 20px;
      margin: 0 0 14px;
      opacity:.9;
    }
    .celebrate img{
      width:min(560px, 96vw);
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
      border: 2px solid rgba(0,0,0,.06);
    }
    .tiny{
      margin-top: 10px;
      font-size: 14px;
      opacity: .75;
    }

    /* Small instruction */
    .hint{
      margin-top: 10px;
      font-size: 14px;
      opacity:.72;
      text-align:center;
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <div class="stage">
    <div class="envelope" id="envelope" role="button" aria-label="Open love letter">
      <div class="env-base"></div>
      <div class="env-flap"></div>
      <div class="env-pocket"></div>
      <div class="seal">💗</div>

      <div class="letter" id="letter">
        <div class="title-row" id="titleRow">
          <h1 class="question">Rg, will you be my Valentine?</h1>
          <div class="side-heart">💘</div>
        </div>

        <p class="subline" id="subline">
          (We’ve been dating for 5–6 years… so be serious 😌)
        </p>

        <div class="button-zone" id="zone">
          <button id="yesBtn" type="button">Yes</button>
          <button id="noBtn" type="button">No</button>
        </div>

        <div class="footer">do you think you have an option?</div>
      </div>
    </div>

    <div class="hint">It will open by itself… but you can tap it too 💌</div>
  </div>

  <div class="celebrate" id="celebrate">
    <div>
      <h2>YAYAA!! 🎉💖</h2>
      <p class="sub">I LOVE YOU TOO 😌❤️</p>

      <!-- Arsenal winning/celebration GIF (replace if you have a specific one) -->
      <img
        src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExd3I0dmZrZTJ2NmVjdWFrcGZtZ2l0Z2ZybnlsY3VicG9nYzBzaGk2MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4Hk0ETSpgxCR95YPgY/giphy.gif"
        alt="Arsenal celebration"
      />

      <div class="tiny">COYG ❤️</div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById("envelope");
    const letter = document.getElementById("letter");
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const celebrate = document.getElementById("celebrate");

    // Confetti setup
    const confettiCanvas = document.getElementById("confettiCanvas");
    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 10,
          spread: 90,
          startVelocity: 45,
          ticks: 170,
          origin: { x: Math.random(), y: Math.random() * 0.25 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 320,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 260);
    }

    // Open choreography (auto + click fallback)
    let opened = false;

    function openEnvelope() {
      if (opened) return;
      opened = true;

      envelope.classList.add("open");

      // After the heart moves + letter slides, reveal text
      setTimeout(() => envelope.classList.add("show-text"), 520);

      // Then reveal buttons after a delay
      setTimeout(() => envelope.classList.add("show-buttons"), 1200);
    }

    // Auto open after a short delay
    setTimeout(openEnvelope, 900);

    // Click / tap always opens
    envelope.addEventListener("click", openEnvelope);

    // Heart pop on mobile tap too
    yesBtn.addEventListener("pointerdown", () => {
      yesBtn.classList.remove("tap-heart");
      void yesBtn.offsetWidth;
      yesBtn.classList.add("tap-heart");
    });

    // YES grows slightly as NO dodges
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.1, yesScale + 0.09);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    // NO runs away (desktop + mobile)
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      let newLeft = (b.left - z.left) + dx * 170;
      let newTop  = (b.top - z.top) + dy * 170;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top  = newTop + "px";
      noBtn.style.transform = "translateY(0)";

      growYes();
    }

    function handlePointer(e) {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top + b.height / 2) - e.clientY
      );
      if (d < 170) moveNo(e.clientX, e.clientY);
    }

    // Only start dodging after buttons appear
    zone.addEventListener("pointermove", (e) => {
      if (!envelope.classList.contains("show-buttons")) return;
      handlePointer(e);
    });
    zone.addEventListener("pointerdown", (e) => {
      if (!envelope.classList.contains("show-buttons")) return;
      handlePointer(e);
    });

    // If they try to tap directly on NO
    noBtn.addEventListener("pointerdown", (e) => {
      if (!envelope.classList.contains("show-buttons")) return;
      e.preventDefault();
      moveNo(e.clientX, e.clientY);
    });
    noBtn.addEventListener("click", (e) => e.preventDefault());

    // YES click -> celebration
    yesBtn.addEventListener("click", () => {
      celebrate.classList.add("show");
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
